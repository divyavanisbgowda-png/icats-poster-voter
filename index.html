<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10402A">
<title>Poster vote — ICATS-FHM 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bar">
  <div class="bar__inner">
    <p class="conf">ICATS-FHM 2026 · Best poster vote</p>
    <ol class="ballot" id="ballot" aria-label="Your ranked choices">
      <li class="slot" data-rank="1">
        <span class="slot__rank">1st</span>
        <input class="slot__input" id="pick1" type="text" inputmode="numeric" autocomplete="off" placeholder="Poster #" aria-label="1st choice poster number" disabled>
        <span class="slot__fb" id="fb1"></span>
      </li>
      <li class="slot" data-rank="2">
        <span class="slot__rank">2nd</span>
        <input class="slot__input" id="pick2" type="text" inputmode="numeric" autocomplete="off" placeholder="Poster #" aria-label="2nd choice poster number" disabled>
        <span class="slot__fb" id="fb2"></span>
      </li>
      <li class="slot" data-rank="3">
        <span class="slot__rank">3rd</span>
        <input class="slot__input" id="pick3" type="text" inputmode="numeric" autocomplete="off" placeholder="Poster #" aria-label="3rd choice poster number" disabled>
        <span class="slot__fb" id="fb3"></span>
      </li>
    </ol>
  </div>
</header>

<main>
  <p class="hint" id="hint">Loading poster list…</p>
</main>

<div class="dock">
  <button id="review" class="btn" disabled>Choose 3 posters to continue</button>
</div>

<dialog id="submit" class="sheet" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">Confirm your ballot</h2>
  <ol class="recap" id="recap"></ol>
  <label class="field">
    <span>Enter your exact name as per your conference ID card</span>
    <input id="voter" autocomplete="name" autocapitalize="words" spellcheck="false"
           inputmode="text" placeholder="e.g. Taro Yamada">
  </label>
  <p class="err" id="err" hidden></p>
  <div class="sheet__actions">
    <button id="cancel" class="btn btn--quiet">Back</button>
    <button id="send" class="btn">Submit ballot</button>
  </div>
</dialog>

<dialog id="done" class="sheet">
  <h2>Ballot received</h2>
  <p>Thank you. Winners are announced at the closing ceremony.</p>
</dialog>

<script src="config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
